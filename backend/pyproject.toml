[project]
name = "competitor-analysis-agent"
version = "0.1.0"
description = "LangChain/LangGraph multi-agent competitor analysis backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "langchain-community>=0.3.0",
  "langchain-tavily>=0.2.0",
  "tavily-python>=0.5.0",
  "ddgs>=9.0.0",
  "duckduckgo-search>=6.0.0",
  "playwright>=1.40.0",
  "httpx>=0.27.0",
  "psycopg[binary]>=3.2.0",
  "reportlab>=4.2.0",
  "python-docx>=1.1.2"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
